<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open claim register | UCC-CoDE eServices</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><div class="brand"><img src="/ucc-logo.png" alt="UCC logo"><div><h1>UCC-CoDE eServices</h1><small>Protected claim register</small></div></div></header><main class="page-wrap"><form id="registerLoginForm" class="form-card" style="max-width:520px;margin:35px auto"><h2>Sign in to the claim register</h2><p>Use the individual staff account authorised for the receiving unit or department. You will return directly to the register and required action.</p><label class="field">Username<input name="username" required autocomplete="username"></label><label class="field">Password<input name="password" type="password" required autocomplete="current-password"></label><button id="registerLoginButton" class="btn" type="submit">Open register</button><p id="registerLoginStatus" class="status" role="alert"></p></form></main><script src="/register-login.js"></script></body></html>
