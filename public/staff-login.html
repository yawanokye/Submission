<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>Functional Units Staff Login | UCC-CoDE eServices</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="topbar"><div class="brand"><img src="/ucc-logo.png" alt="UCC logo"><div><h1>UCC-CoDE eServices</h1><small>Functional Units Staff Portal</small></div></div><a class="navlink" href="/">Public portal</a></header>
<main class="page-wrap"><form id="staffLoginForm" class="form-card login-card"><div class="page-intro compact"><span class="eyebrow">Protected access</span><h2>Functional Units Staff Login</h2><p>Sign in with the individual account issued by the portal administrator.</p></div><div id="sessionNotice" class="status" role="status"></div><section class="section"><div class="field"><label for="username">Username <span class="req">*</span></label><input id="username" name="username" required autocomplete="username"></div><div class="field"><label for="password">Password <span class="req">*</span></label><input id="password" name="password" type="password" required autocomplete="current-password"></div></section><div class="actions"><button id="loginBtn" class="btn" type="submit">Sign in</button></div><div id="status" class="status" role="status"></div></form></main><footer>UCC-CoDE eServices · University of Cape Coast</footer>
<script>(function(){const form=document.getElementById('staffLoginForm'),button=document.getElementById('loginBtn'),status=document.getElementById('status'),notice=document.getElementById('sessionNotice'),query=new URLSearchParams(location.search);if(query.get('reason')){notice.className='status show bad';notice.textContent=query.get('reason')==='session-error'?'Your staff session could not be verified. Sign in again to reopen the assigned case.':'Your staff session expired. Sign in again to reopen the assigned case, then submit the action again.';}form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;button.disabled=true;status.className='status';try{const response=await fetch('/api/staff-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Sign-in failed.');const next=query.get('next');const safeNext=next&&(/^\/(staff|support-admin)(?:[/?]|$)/.test(next)||/^\/secure\/support-assignment\/[a-f0-9]{64}(?:[/?]|$)/i.test(next));location.href=safeNext?next:(data.redirect||'/staff');}catch(error){status.className='status show bad';status.textContent=error.message||'Sign-in failed.';}finally{button.disabled=false;}});})();</script></body></html>
