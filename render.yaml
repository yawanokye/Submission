services:
  - type: web
    name: ucc-submission-portals
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_DIR
        value: /var/data/ucc-submission-portals
    disk:
      name: submission-data
      mountPath: /var/data
      sizeGB: 5
