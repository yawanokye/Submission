services:
  - type: web
    name: projectwork-submission-portal
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_DIR
        value: /var/data/projectwork_portal
    disk:
      name: projectwork-data
      mountPath: /var/data
      sizeGB: 10
