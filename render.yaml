databases:
  - name: vprofessor-db
    plan: basic-256mb

services:
  - type: web
    name: vprofessor-web
    runtime: python
    plan: standard
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars: &vprofessorEnv
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: System Administrator
      - key: VPROF_RESET_ADMIN_PASSWORD_ON_STARTUP
        value: false
      - key: VPROF_ADMIN_REQUIRE_PASSWORD_CHANGE_AFTER_RESET
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: vprofessor-db
          property: connectionString
      - key: REVIEW_STORAGE_DIR
        value: /tmp/vprofessor/reviews
      - key: REVIEW_STORAGE_FALLBACK_DIR
        value: /tmp/vprofessor/reviews
      - key: VPROF_DB_ARTIFACT_STORAGE
